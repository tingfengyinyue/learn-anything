[project]
name = "learn-anything"
version = "0.1.0"
description = "基于十步学习法的多用户学习引擎：FastAPI 服务端 + CLI 客户端，可插拔 LLM 与联网搜索"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "anthropic>=1.0,<3",  # 1.15 与 2.1 实测通过
    "openai>=1.30",
    "pypdf>=4.0",
]

[project.optional-dependencies]
ddg = ["ddgs>=9.0"]
dev = ["pytest>=8.0"]

[project.scripts]
learn = "learn_anything.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/learn_anything"]

[tool.pytest.ini_options]
testpaths = ["tests"]
